<!doctype html>
<html lang="en" data-mode="local">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Français (offline)</title>
  <meta name="description" content="French vocabulary trainer — device-only version, no sign-in">
  <meta name="theme-color" content="#1f4e9c">
  <link rel="manifest" href="local.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Français offline">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="app-header">
    <h1>Français</h1>
    <span class="status" id="status" aria-live="polite"></span>
    <label class="toggle"><input type="checkbox" id="online-toggle"><span>Online</span></label>
    <button type="button" class="link-button" id="sign-out" hidden>Sign out</button>
  </header>
  <div class="accent-bar" id="accent-bar" hidden></div>
  <div class="notices" id="notices"></div>
  <main id="main">
    <section class="card"><p>Chargement…</p></section>
  </main>
</body>
</html>
